<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; gap: 16px; padding: 16px; box-sizing: border-box; }
  button { flex: 1; font-size: 48px; font-weight: bold; border: none; border-radius: 20px; color: #fff; cursor: pointer; }
  #stop { background: #d93025; }
  #ip { text-align: center; font-size: 22px; font-family: sans-serif; color: #555; }
  #count { text-align: center; font-size: 32px; font-family: sans-serif; }
</style>
</head>
<body>
<div id="ip">IP: loading...</div>
<div id="count">0 / 500</div>
<button id="stop">STOP</button>

<script>
  const url = "https://virtual.smartthings.com/?id=1003143";
  const openTime = 3000; // open 3 seconds
  const waitTime = 500;  // short pause before reopening
  const maxCount = 500;  // stop after this many opens
  let count = 0;
  let running = true;    // Set to true by default to autorun
  let win = null;

  const countEl = document.getElementById("count");
  const updateCount = () => countEl.textContent = count + " / " + maxCount;

  const ipEl = document.getElementById("ip");
  async function showIP() {
    try {
      const r = await fetch("https://api.ipify.org?format=json");
      const d = await r.json();
      ipEl.textContent = "IP: " + d.ip;
    } catch (e) {
      ipEl.textContent = "IP: unavailable";
    }
  }

  function cycle() {
    if (!running) return;
    if (count >= maxCount) {
      running = false;
      countEl.textContent = "Done: " + count + " / " + maxCount;
      return;
    }
    showIP();
    win = window.open(url, "_blank", "width=800,height=600");
    count++;
    updateCount();
    setTimeout(() => {
      if (win && !win.closed) win.close();
      setTimeout(cycle, waitTime);
    }, openTime);
  }

  // Stop button handler
  document.getElementById("stop").onclick = () => {
    running = false;
    if (win && !win.closed) win.close();
  };

  // Run automatically on page load
  window.addEventListener("DOMContentLoaded", () => {
    showIP();
    cycle();
  });
</script>
</body>
</html>

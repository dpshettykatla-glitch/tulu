<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d">
<title>Auto Opener</title>
<style>
  :root {
    --bg: #eef2f7;
    --surface: #ffffff;
    --text: #14202e;
    --muted: #5d6b7c;
    --track: #dbe3ee;
    --accent: #1f6feb;
    --danger: #d93025;
    --ok: #1a8f4c;
    --shadow: 0 8px 30px rgba(20, 32, 46, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1b2d;
      --surface: #172740;
      --text: #eef3fa;
      --muted: #9aaac0;
      --track: #263a58;
      --accent: #5b9dff;
      --danger: #ef5b50;
      --ok: #3ccf7a;
      --shadow: 0 8px 30px rgba(0, 0, 0, .35);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    gap: 16px;
    max-width: 520px;
    margin: 0 auto;
  }

  .status {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); border-radius: 18px; padding: 14px 18px;
    box-shadow: var(--shadow);
  }
  .status small { display: block; color: var(--muted); font-size: 13px; margin-bottom: 2px; }
  .status strong { font-size: 18px; font-variant-numeric: tabular-nums; word-break: break-all; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 600; color: var(--muted);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .badge.running { color: var(--ok); }
  .badge.running .dot { background: var(--ok); animation: pulse 1.2s ease-in-out infinite; }
  .badge.done { color: var(--accent); }
  .badge.done .dot { background: var(--accent); }
  @keyframes pulse { 50% { opacity: .25; } }

  .stage {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface); border-radius: 28px; box-shadow: var(--shadow);
    padding: 24px;
  }
  .ring { position: relative; width: min(100%, 300px); aspect-ratio: 1; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 14; }
  .ring .track { stroke: var(--track); }
  .ring .bar {
    stroke: var(--accent); stroke-linecap: round;
    stroke-dasharray: 534; stroke-dashoffset: 534;
    transition: stroke-dashoffset .4s ease;
  }
  .ring .label {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  .num { font-size: clamp(44px, 16vw, 68px); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .of { margin-top: 8px; color: var(--muted); font-size: 16px; }

  .actions { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .actions.two { grid-template-columns: 1fr 1fr; }
  button {
    font: inherit; font-size: 20px; font-weight: 700; color: #fff;
    border: 0; border-radius: 18px; min-height: 64px; cursor: pointer;
    transition: transform .08s ease, opacity .2s ease;
  }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #start { background: var(--accent); }
  #stop { background: var(--danger); }
  #reset { background: var(--track); color: var(--text); }

  .note {
    margin: 0; text-align: center; font-size: 13px; line-height: 1.4;
    color: var(--muted); min-height: 1.4em;
  }

  @media (max-height: 640px) {
    .stage { padding: 12px; }
    .ring { width: min(100%, 200px); }
    button { min-height: 52px; font-size: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .badge.running .dot { animation: none; }
    .ring .bar, button { transition: none; }
  }
</style>
</head>
<body>

<header class="status">
  <div>
    <small>Your IP address</small>
    <strong id="ip">Loading…</strong>
  </div>
  <span class="badge" id="badge"><span class="dot"></span><span id="badgeText">Ready</span></span>
</header>

<main class="stage">
  <div class="ring" role="progressbar" aria-valuemin="0" aria-valuemax="500" aria-valuenow="0" id="ringA11y">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle class="track" cx="100" cy="100" r="85"></circle>
      <circle class="bar" id="bar" cx="100" cy="100" r="85"></circle>
    </svg>
    <div class="label">
      <div class="num" id="num">0</div>
      <div class="of" id="of">of 500 opens</div>
    </div>
  </div>
</main>

<p class="note" id="note"></p>

<div class="actions" id="actions">
  <button id="start">Start</button>
  <button id="stop" hidden>Stop</button>
  <button id="reset" hidden>Reset</button>
</div>

<script>
  const url = "https://virtual.smartthings.com/?id=1003143";
  const openTime = 3000; // keep each window open for 3 seconds
  const waitTime = 500;  // short pause before reopening
  const maxCount = 500;  // stop after this many opens
  const CIRC = 2 * Math.PI * 85;

  let count = 0;
  let running = false;
  let win = null;
  let timer = null;

  const $ = (id) => document.getElementById(id);
  const ipEl = $("ip"), numEl = $("num"), ofEl = $("of"), barEl = $("bar");
  const badge = $("badge"), badgeText = $("badgeText"), noteEl = $("note");
  const startBtn = $("start"), stopBtn = $("stop"), resetBtn = $("reset");
  const actions = $("actions"), ring = $("ringA11y");

  function render(state) {
    numEl.textContent = count;
    ofEl.textContent = "of " + maxCount + " opens";
    barEl.style.strokeDashoffset = CIRC * (1 - count / maxCount);
    ring.setAttribute("aria-valuenow", count);

    badge.className = "badge " + (state === "running" ? "running" : state === "done" ? "done" : "");
    badgeText.textContent = state === "running" ? "Running" : state === "done" ? "Finished" : count ? "Stopped" : "Ready";

    startBtn.hidden = state === "running" || state === "done";
    startBtn.textContent = count ? "Resume" : "Start";
    stopBtn.hidden = state !== "running";
    resetBtn.hidden = state === "running" || count === 0;
    actions.classList.toggle("two", !startBtn.hidden && !resetBtn.hidden);
  }

  async function showIP() {
    try {
      const r = await fetch("https://api.ipify.org?format=json");
      const d = await r.json();
      ipEl.textContent = d.ip;
    } catch (e) {
      ipEl.textContent = "Unavailable";
    }
  }

  function finish() {
    running = false;
    render("done");
    noteEl.textContent = "All " + maxCount + " opens completed.";
  }

  function cycle() {
    if (!running) return;
    if (count >= maxCount) return finish();

    showIP();
    win = window.open(url, "_blank", "width=800,height=600");
    if (!win) {
      running = false;
      render("idle");
      noteEl.textContent = "Your browser blocked the pop-up. Allow pop-ups for this page, then tap Resume.";
      return;
    }
    count++;
    render("running");

    timer = setTimeout(() => {
      if (win && !win.closed) win.close();
      timer = setTimeout(cycle, waitTime);
    }, openTime);
  }

  function start() {
    if (running) return;
    running = true;
    noteEl.textContent = "";
    render("running");
    cycle();
  }

  function stop() {
    running = false;
    clearTimeout(timer);
    if (win && !win.closed) win.close();
    render("idle");
    noteEl.textContent = "Stopped. Tap Resume to continue.";
  }

  function reset() {
    stop();
    count = 0;
    noteEl.textContent = "";
    render("idle");
  }

  startBtn.addEventListener("click", start);
  stopBtn.addEventListener("click", stop);
  resetBtn.addEventListener("click", reset);

  showIP();
  render("idle");
  start(); // autorun on load, as in the original
</script>
</body>
</html>
